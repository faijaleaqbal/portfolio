  <!-- Shared Design Tokens & Stylesheet -->
  <link rel="stylesheet" href="styles/main.css?v=20260904_cinematic">

  <style>
    .error-viewport {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem var(--pad-page);
      position: relative;
      z-index: 10;
    }

    .error-code-badge {
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--acc-core);
      padding: 0.35rem 0.85rem;
      background: rgba(99, 119, 255, 0.1);
      border: 1px solid var(--line-accent);
      border-radius: 99px;
      margin-bottom: 1.5rem;
    }

    .error-giant-num {
      font-family: var(--font-display);
      font-size: clamp(5rem, 16vw, 9.5rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      background: linear-gradient(115deg, var(--ink-primary) 30%, var(--acc-core) 70%, var(--acc-violet) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      font-weight: 700;
      color: var(--ink-primary);
      margin-bottom: 0.75rem;
    }

    .error-desc {
      max-width: 460px;
      font-size: var(--fs-body);
      color: var(--ink-secondary);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .error-console {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--ink-secondary);
      background: var(--bg-plate);
      border: 1px solid var(--line-hair);
      border-radius: var(--radius-sm);
      padding: 1.1rem 1.4rem;
      margin-bottom: 2.5rem;
      text-align: left;
      max-width: 440px;
      width: 100%;
    }

    .error-console span.method { color: var(--acc-cyan); font-weight: 600; }
    .error-console span.status { color: #f87171; font-weight: 600; }
    .error-console span.dim { color: var(--ink-tertiary); display: block; margin-top: 0.4rem; }

    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Textural Overlays -->
  <div class="grain-overlay" aria-hidden="true"></div>
  <div class="vignette-overlay" aria-hidden="true"></div>

  <main class="error-viewport container">
    <div class="error-code-badge">HTTP 404 // COORDINATE UNRESOLVED</div>
    <div class="error-giant-num" aria-hidden="true">404</div>
    <h1 class="error-title">Coordinate Out of Range</h1>
    <p class="error-desc">
      The resource, path, or route you requested does not exist on this server.
    </p>

    <div class="error-console">
      <code>
        <span class="method">GET</span> requested_path <span class="status">&rarr; 404 NOT_FOUND</span>
        <span class="dim">// no matching node on faijaleaqbal.duckdns.org</span>
      </code>
    </div>

    <div class="error-actions">
      <a href="/" class="btn-primary">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        <span>Return to Portfolio</span>
      </a>
      <a href="/#projects" class="btn-secondary">
        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
        <span>Selected Work</span>
      </a>
    </div>
  </main>

</body>
</html>
